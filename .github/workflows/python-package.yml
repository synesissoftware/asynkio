# This workflow will install Python dependencies, run tests, and smoke
# the sdist/wheel on a range of Python versions.
#
# Created: 14th September 2026
# Updated: 14th September 2026
#

name: Python package

on:
  push:
    branches:
      - master
      - dev
      - boilerplate
      - idiomatic
      - rc1
      - rc2
      - rc3
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (ruff / black)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.14"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    # Committed files end with an extra blank line for vi/vim; black expects a
    # single trailing newline, so strip before --check (see .editorconfig).
    - name: Strip trailing blank lines for formatters
      run: ./scripts/strip_trailing_blank_line.sh

    - name: Lint with ruff
      run: ruff check .

    - name: Check formatting with black
      run: black --check .

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
    - name: Checking out code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[test]"

    - name: Test with pytest
      run: |
        pytest

    - name: Build and install smoke
      run: |
        python -m pip install build
        python -m build
        python -m pip install dist/asynkio-*.whl
        python -c "import asynkio; assert asynkio.__version__ == '0.1.1'; print(asynkio.__version__)"
